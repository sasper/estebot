name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
      - name: Test
        run: pytest -q

  no-personal-data:
    # The core privacy guarantee, enforced rather than documented.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no personal data is tracked
        run: |
          set -e
          banned='ledger.md|context-log.md|annotations.csv|corrections.csv|renames.csv|predictions.toml|supplements.toml|health-context.txt|estebot.toml|\.sqlite$|^tidy/|^raw/'
          if git ls-files | grep -Ei "$banned"; then
            echo "::error::A personal-data file is tracked in this repository."
            exit 1
          fi
          echo "Clean: no personal-data paths tracked."

  deploy:
    # Merging to main is the deploy, so the live site always matches main. It waits for the
    # tests and the personal-data check, and never runs for a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, no-personal-data]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false      # let a running deploy finish; the next one queues
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be  # 1.5
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
