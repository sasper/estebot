# EsteCoach at estecoach.app: the public demo for visitors, and with the private-mode secrets
# set (see deploy/entrypoint.sh), each signed-in person's own page. The volume holds the
# cloned data repo and each person's app.sqlite; the demo is regenerated at every start.
# Merging to main deploys it (the deploy job in .github/workflows/ci.yml, after the tests).
# By hand: deploy from a clean `git archive` export, never from a directory with estecoach.toml.
app = "estebot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ESTECOACH_BASE_URL = "https://estecoach.app"
  # Early-access requests: on the volume, so a deploy or a restart never loses them.
  ESTECOACH_SIGNUPS = "/data/signups.sqlite"
  TZ = "America/New_York"
  # 04:30 brings yesterday's food and workouts in before the morning's call; noon is the backstop.
  SYNC_AT = "04:30,12:00"

[mounts]
  source = "estebot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The daily sync runs inside the machine, so it stays up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "30s"
    interval = "60s"
    timeout = "5s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
