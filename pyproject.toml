[project]
name = "estebot"
version = "0.1.0"
description = "Single-subject training and bodyweight analysis over your own exported health data"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.32", "jinja2>=3.1", "python-multipart>=0.0.18", "anthropic>=2.3"]
# Playwright drives the phone-width layout test; without it that test skips.
dev = ["pytest>=8.3", "playwright>=1.48"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The page's template and static files. Without this a non-editable install (the Docker
# image) leaves them out and the app fails at import.
[tool.setuptools.package-data]
"estebot.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
