# The public demo at estebot.app. It serves a made-up person (python -m estebot.demo),
# regenerated at every start, read-only (ESTEBOT_DEMO=1, set in the Dockerfile). No volume:
# a machine stopped while idle comes back with fresh data.
# Deploy from a clean `git archive` export, never from a directory that has estebot.toml.
app = "estebot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "10s"
    interval = "60s"
    timeout = "5s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
